<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#065f46" />
  <title>BioGating — SAF Engineering Screening</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #071915; color: #ecfdf5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .badge { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #059669, #10b981); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 18px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #a7f3d0; max-width: 340px; line-height: 1.5; margin-bottom: 24px; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgba(16, 185, 129, 0.25); border-top-color: #10b981; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { background: #10b981; color: #052e16; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
    #status { font-size: 12px; color: #6ee7b7; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="badge">B</div>
  <h1>BioGating</h1>
  <p>HEFA-SAF Yield Prediction, ASTM D7566 Lab Compliance & Fuel Blending Screening Tool</p>
  <div class="spinner" id="loader"></div>
  <div id="status">Connecting to BioGating Server...</div>
  <br/>
  <a href="https://biogating.onrender.com/yield" class="btn" id="retryBtn" style="display:none;">Launch BioGating</a>
  <script>
    const targetUrl = "https://biogating.onrender.com/yield";
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 600);
    setTimeout(() => {
      document.getElementById("loader").style.display = "none";
      document.getElementById("retryBtn").style.display = "inline-block";
      document.getElementById("status").textContent = "Server waking up on Render — tap below if not redirected.";
    }, 6000);
  </script>
</body>
</html>
